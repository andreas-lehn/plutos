name: Plutos Unit Tests

# Wann soll der Test laufen?
on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main", "production" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Quellcode aus GitHub auf den virtuellen Server laden
    - name: Code auschecken
      uses: actions/checkout@v4

    # 2. Python auf dem Server einrichten
    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Hier kannst du deine Python-Version eintragen

    # 3. HIER STARTET DAS SETUP FÜR UV:
    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true # Nutzt Caching, damit es in Sekunden durchläuft

    # 4. Abhängigkeiten direkt aus der pyproject.toml installieren
    - name: Install dependencies
      run: uv sync --all-groups

    # 5. Tests mit pytest ausführen
    - name: Run Tests with coverage
      run: uv run pytest

    # Dieser fertige Baustein lädt den Report vollautomatisch zu Codecov hoch
    - name: Upload report to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # Wird gleich im nächsten Schritt eingerichtet    
